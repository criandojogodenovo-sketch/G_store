org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
org.gradle.parallel=true
org.gradle.caching=true
android.nonTransitiveRClass=true

# ── Configuração pública do cliente Neon (não são segredos) ─────
# As URLs do Neon Auth e da Data API são dados públicos do cliente
# (vão dentro de qualquer APK e não permitem nenhuma operação de
# administrador — toda a segurança é feita por RLS no Postgres).
NEON_AUTH_URL=https://ep-bitter-sunset-b4vhekpy.neonauth.c-6.us-east-2.aws.neon.tech/neondb/auth
NEON_DATA_API_URL=https://ep-bitter-sunset-b4vhekpy.apirest.c-6.us-east-2.aws.neon.tech/neondb/rest/v1
# Origem enviada no header Origin nas chamadas ao Neon Auth — tem de
# estar na lista de trusted origins (Neon Console → Auth → Configuration).
NEON_AUTH_ORIGIN=https://gstore.app
