name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Ktor) — build + testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build e testes unitários
        run: gradle test --no-daemon

      - name: Publicar relatório de testes (em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/
          retention-days: 7

      # Testes de integração reais (Neon/GitHub) rodam APENAS se o repositório
      # tiver o repositório-var RUN_INTEGRATION_TESTS=true e os secrets.
      # Sem os secrets, esses testes são pulados automaticamente.
      - name: Build + testes de integração (opcional)
        if: ${{ vars.RUN_INTEGRATION_TESTS == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TEST_TOKEN: ${{ secrets.G_STORE_GITHUB_TOKEN }}
          GITHUB_TEST_REPO: ${{ github.repository }}
        run: gradle test --no-daemon --rerun-tasks

  worker-legacy:
    name: Worker legado — verificação de build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependências
        run: npm install --omit=dev
      # Verificação de sintaxe do Worker (deploy NÃO é feito no CI).
      - name: Verificar sintaxe
        run: node --check src/index.js

  android:
    name: Android — build + testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Testes unitários
        run: gradle testDebugUnitTest --no-daemon

      - name: Build APK (debug)
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: gstore-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
