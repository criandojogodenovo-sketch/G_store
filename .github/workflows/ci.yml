name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-legacy:
    name: Worker legado — verificação de build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependências
        run: npm install --omit=dev
      # Verificação de sintaxe do Worker (deploy NÃO é feito no CI).
      - name: Verificar sintaxe
        run: node --check src/index.js

  android:
    name: Android — build + testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # O runner ubuntu-latest já inclui o Android SDK com licenças aceitas;
      # o AGP baixa automaticamente os componentes que faltarem.

      - name: Configurar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Testes unitários
        run: gradle testDebugUnitTest --no-daemon

      - name: Build APK (debug)
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: gstore-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
